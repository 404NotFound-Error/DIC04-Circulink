<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Green gradient background -->
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#90EE90;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7FD87F;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="1200" height="400" fill="url(#greenGrad)"/>
  
  <!-- Circulink Text -->
  <text x="600" y="120" font-size="80" font-weight="bold" text-anchor="middle" fill="#2D5016" font-family="Arial, sans-serif">
    CIRCULINK
  </text>
  
  <!-- Shopping Cart with Eco Items -->
  <g transform="translate(600, 200)">
    <!-- Cart base -->
    <path d="M -80 -40 L 80 -40 L 100 40 L -100 40 Z" fill="none" stroke="#2D5016" stroke-width="8" stroke-linejoin="round"/>
    
    <!-- Cart wheels -->
    <circle cx="-60" cy="50" r="15" fill="none" stroke="#2D5016" stroke-width="6"/>
    <circle cx="60" cy="50" r="15" fill="none" stroke="#2D5016" stroke-width="6"/>
    
    <!-- Handle -->
    <path d="M -40 -40 Q -40 -80 40 -80 Q 40 -40 40 -40" fill="none" stroke="#2D5016" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Plant leaves -->
    <g transform="translate(-50, -50)">
      <ellipse cx="0" cy="-15" rx="12" ry="25" fill="#4CAF50" transform="rotate(-30)"/>
      <ellipse cx="10" cy="-10" rx="12" ry="25" fill="#5CBF60" transform="rotate(30)"/>
    </g>
    
    <!-- Recycle symbol -->
    <g transform="translate(0, -45)">
      <circle cx="0" cy="0" r="20" fill="none" stroke="#4CAF50" stroke-width="3"/>
      <path d="M -5 -15 L 0 -5 L 5 -10" fill="none" stroke="#4CAF50" stroke-width="2" stroke-linecap="round"/>
      <path d="M 15 5 L 8 8 L 8 -3" fill="none" stroke="#4CAF50" stroke-width="2" stroke-linecap="round"/>
      <path d="M -15 5 L -8 -3 L -8 8" fill="none" stroke="#4CAF50" stroke-width="2" stroke-linecap="round"/>
    </g>
    
    <!-- Eco items in cart -->
    <rect x="-60" y="-20" width="30" height="35" fill="#7FD87F" opacity="0.8"/>
    <rect x="-20" y="-15" width="25" height="30" fill="#5CBF60" opacity="0.9"/>
    <rect x="20" y="-20" width="30" height="35" fill="#4CAF50" opacity="0.8"/>
  </g>
  
  <!-- Tagline -->
  <text x="600" y="350" font-size="24" text-anchor="middle" fill="#2D5016" font-family="Arial, sans-serif" opacity="0.8">
    Circular Economy for Everyone
  </text>
</svg>
